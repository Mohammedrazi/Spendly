<style>
:root{--bg:#000;--card:#1b1c20;--ink:#e3e8f5;--mute:#8b909c;--pri:#b4c8f5;--on:#10203d;--grn:#7dc08a;--red:#e8827c;--line:#2a2c33}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--line);padding:10px 2px;width:100%;outline:0}
input:focus{border-color:var(--pri)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 150px}
h1{font-size:2.1rem;margin:28px 4px 14px;color:var(--pri)}
.hi{margin:28px 4px 0;font-size:1.5rem;font-weight:700}.hi+h1{margin-top:0;font-size:2.3rem}
.sum{display:inline-block;border:2px solid var(--grn);background:var(--card);border-radius:22px;padding:14px 20px;margin:6px 0 14px}
.sums{display:flex;flex-wrap:wrap;gap:12px;margin:6px 0 14px}.sums .sum{margin:0;min-width:150px;flex:1 1 150px}.sum.bal.neg{border-color:var(--red)}.sum.bal.neg .n{color:var(--red)}.sum small{display:block;color:var(--mute);font-size:.8rem;margin-top:2px}
.sum b{font-size:1.3rem}.sum .n{color:var(--grn);font-size:1.4rem;font-weight:700;display:block}
.panel{background:#1d1e22;border-radius:26px;padding:12px;margin-bottom:12px}
.day{display:flex;justify-content:space-between;color:var(--mute);margin:14px 6px 4px;font-size:.95rem}
.tx{display:flex;align-items:center;gap:14px;width:100%;padding:8px 6px;text-align:left}
.ci{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;font-style:normal;flex:none}
.g{flex:1;min-width:0}.g b{display:block;font-size:1.15rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g em{font-style:normal;font-size:.8rem;background:#233225;color:#b9d7bd;border-radius:7px;padding:2px 9px}
.g em.i{background:#1f3a2c}
.a{font-size:1.2rem;white-space:nowrap}.red{color:var(--red)}.grn{color:var(--grn)}
.months{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 -16px 10px;scrollbar-width:none}
.months button{padding:12px 20px;color:var(--mute);white-space:nowrap;border-bottom:4px solid transparent}
.months button.on{color:#fff;font-weight:700;border-color:var(--pri);border-radius:4px}
.bar3{display:flex;justify-content:space-around;background:#222;border-radius:12px;padding:10px;margin-bottom:6px}
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px);max-width:532px;display:flex;background:#16171b;border:2px solid #2b2d33;border-radius:36px;padding:6px;z-index:5}
.pill button{flex:1;padding:10px 0;border-radius:28px;font-size:.72rem;color:#cfd6e6}
.pill button b{display:block;font-size:1.35rem}.pill button.on{background:#475266;color:#fff}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(110px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:22px;background:#b9c6e0;color:#222;font-size:2.2rem;z-index:5}
.opt{display:flex;align-items:center;gap:14px;width:100%;border:2px solid var(--line);border-radius:22px;padding:16px;margin-bottom:10px;text-align:left}
.opt span{display:block;color:var(--mute);font-size:.85rem}.opt b{font-weight:500;font-size:1.1rem}
.bud{border:2px solid var(--line);border-radius:22px;padding:14px;margin-bottom:10px;width:100%;text-align:left}
.pg{height:10px;background:#2a2c33;border-radius:6px;margin-top:10px;overflow:hidden}.pg i{display:block;height:100%;background:var(--pri)}.pg i.o{background:var(--red)}
.dev{text-align:center;color:var(--mute);font-size:.9rem;margin:34px 0 0;letter-spacing:.02em}
.mute{color:var(--mute)}.empty{text-align:center;color:var(--mute);padding:30px}
.page{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 0 120px}
.page.top{z-index:30}
.ph{display:flex;align-items:center;padding:6px 14px}.ph b{flex:1;text-align:center;font-size:1.3rem;color:var(--pri);margin-right:30px}
.ph button{font-size:2rem;width:30px;line-height:1}
.tabs{display:flex;background:#222;border-radius:14px;margin:8px 16px;padding:4px}
.tabs button{flex:1;padding:12px;border-radius:11px}.tabs button.on{background:#43464e;font-weight:700}
.amt{display:flex;align-items:center;gap:12px;margin:10px 16px;background:#252b37;border-radius:22px;padding:14px}
.amt input{border:0;font-size:2.2rem;text-align:right;font-weight:700}.amt span{font-size:1.6rem;font-weight:700;color:var(--mute)}
.row2{display:flex;gap:10px;margin:8px 16px}.row2 input{border:0;background:#1d1e22;border-radius:14px;padding:14px}
.f{margin:8px 16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;padding:10px 16px}
.grid button{text-align:center;font-size:.8rem;overflow:hidden}
.grid i{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 4px;border-radius:22px;font-size:2rem;font-style:normal;border:3px solid transparent}
.grid .sel i{border-color:#fff}.grid .add i{border:2px solid #444;background:none;color:#aaa}
.save{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg);display:flex;gap:10px}
.save button{flex:1;padding:16px;border-radius:18px;background:var(--pri);color:var(--on);font-weight:700}.save .del{background:#3a2020;color:var(--red)}
.cols{display:flex;gap:12px;flex-wrap:wrap;padding:12px 16px}.cols button{width:44px;height:44px;border-radius:50%;border:3px solid transparent}.cols .sel{border-color:#fff}
.emo{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px}.emo button{width:44px;height:44px;border-radius:12px;background:#1d1e22;font-size:1.4rem}.emo .sel{outline:2px solid #fff}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lc{width:100%;max-width:380px;background:var(--card);border-radius:28px;padding:28px}
.lc h2{margin:0 0 4px;font-size:1.8rem;color:var(--pri)}.lc label{display:block;margin-top:18px;color:var(--mute);font-size:.85rem}
.lc .go{width:100%;margin-top:26px;padding:15px;border-radius:18px;background:var(--pri);color:var(--on);font-weight:700}
.seg3{display:flex;background:#222;border-radius:14px;padding:4px;margin:18px 0 0;gap:4px}.seg3 button{flex:1;padding:10px 4px;border-radius:11px;font-size:.9rem;color:var(--mute)}.seg3 button.on{background:#43464e;color:#fff;font-weight:700}.lnk{display:block;margin:14px auto 0;color:var(--pri);font-size:.9rem}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:grid;place-items:center;padding:20px}.mc{background:#1b1c20;border-radius:24px;padding:22px;width:100%;max-width:380px}.acts2{display:flex;gap:10px;margin-top:16px}.btn2{flex:1;padding:14px;border-radius:14px;background:var(--pri);color:var(--on);font-weight:700}.btn2.alt{background:#2a2c33;color:var(--ink)}.btn2.dng{background:#5a2020;color:var(--red)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--mute);font-weight:700;font-size:.85rem;margin:14px 8px 6px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 8px}.cw{position:relative}
.cd{width:100%;aspect-ratio:.8;border-radius:12px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px}
.cd b{font-weight:500;font-size:1.05rem}.cd small{font-size:.62rem;color:var(--mute)}.cd small.red{color:var(--red)}.cd small.grn{color:var(--grn)}
.cd i{height:7px;display:flex;gap:4px}.cd u{width:7px;height:7px;border-radius:50%;display:block}.cd u.g{background:var(--grn)}.cd u.r{background:var(--red)}
.cd.ps{border-color:#3f7a4a}.cd.ng{border-color:#8a4a48}.cd.td{background:#3a4352}.cd.sel{background:#8aa5cc;color:#10203d}.cd.sel small{color:#10203d}
.pl{position:absolute;top:-8px;right:-4px;width:26px;height:26px;border-radius:50%;background:#b4c8f5;color:#10203d;font-weight:700;z-index:2;line-height:1}
.err{color:var(--red);margin:12px 0 0;min-height:1.2em;font-size:.9rem}

/* =====================================================================
   RESPONSIVE LAYOUTS
   Phones (under 700px) keep the original layout above, unchanged.
   Tablet  : 700px and up   -> two-column home, card grids, centered dialogs
   Laptop  : 1100px and up  -> left sidebar, wider content, hover states
   ===================================================================== */

/* ---------- Tablet and up ---------- */
@media (min-width:700px){
  .wrap{max-width:900px;padding-left:28px;padding-right:28px}
  .months{margin-left:-28px;margin-right:-28px}
  .pill{max-width:620px}
  .fab{right:28px}

  .dash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px;align-items:start}
  .cards,.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .cards .bud,.opts .opt{margin-bottom:0}
  .panel svg{display:block;max-height:340px;margin:0 auto}

  .login{padding:40px}
  .lc{max-width:440px;padding:36px}
  .mc{max-width:440px}

  /* Full-screen pages become centered dialogs */
  .page{inset:auto;top:4vh;bottom:4vh;left:0;right:0;margin:0 auto;width:min(680px,94vw);
    padding:12px 0 0;display:flex;flex-direction:column;background:#0b0c0f;
    border:2px solid var(--line);border-radius:28px;box-shadow:0 24px 70px rgba(0,0,0,.65)}
  /* dim the app behind any open dialog (sits between the app, z-index 5, and dialogs, z-index 20+) */
  body:has(.page:not([hidden]):not(.tabm))::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:19}
  .page .save{position:sticky;left:auto;right:auto;bottom:0;max-width:none;margin:auto 0 0;padding:16px;background:#0b0c0f;border-radius:0 0 26px 26px}
  .page .months{margin-left:0;margin-right:0}
  .grid{grid-template-columns:repeat(6,1fr)}
}

/* ---------- Laptop and desktop ---------- */
@media (min-width:1100px){
  #app{padding-left:240px}
  .pill{left:0;top:0;bottom:0;transform:none;width:240px;max-width:none;flex-direction:column;justify-content:flex-start;gap:6px;
    border:0;border-right:2px solid #1d1f25;border-radius:0;padding:92px 14px 14px;background:#0b0c0f}
  .pill::before{content:"Spendly";position:absolute;top:28px;left:28px;font-size:1.7rem;font-weight:700;color:var(--pri)}
  .pill button{flex:none;display:flex;align-items:center;gap:14px;padding:14px 18px;font-size:1rem;text-align:left;border-radius:16px}
  .pill button b{display:inline-block;font-size:1.35rem;width:1.6em;text-align:center}

  .wrap{max-width:1160px;padding:32px 44px 60px}
  .months{margin-left:0;margin-right:0}
  .t-tx{max-width:860px}
  .t-more{max-width:960px}
  h1{font-size:2.4rem}
  .hi+h1{font-size:2.6rem}
  .dash{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:0 44px}
  .dl{position:sticky;top:24px}
  .fab{right:44px;bottom:36px}
}

@media (min-width:1600px){
  .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
  .wrap{max-width:1320px}
}

/* ---------- Mouse / trackpad niceties (not applied on touch screens) ---------- */
@media (hover:hover){
  .tx:hover{background:#24262c;border-radius:16px}
  .opt:hover,.bud:hover{border-color:#3d414b;background:#14161b}
  .pill button:hover:not(.on){background:#23252c}
  .fab:hover{filter:brightness(1.08)}
  .cd:hover:not(.sel){background:#262932}
  .grid button:hover i{filter:brightness(1.15)}
  .months button:hover:not(.on){color:#fff}
}

.scanb{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border:2px dashed var(--pri);border-radius:18px;color:var(--pri);font-weight:700}
.scm{margin:8px 4px 0;font-size:.85rem;color:var(--mute);min-height:1.2em}

/* Analytics as a bottom/side-nav tab: sits above the page, below the nav */
.page.tabm{z-index:4;padding-bottom:130px}
.page.tabm .ph{display:none}
@media (min-width:700px){
  .page.tabm{inset:0;top:0;bottom:0;margin:0 auto;width:min(960px,100%);border:0;border-radius:0;box-shadow:none;padding:24px 0 130px;display:block;background:var(--bg)}
}
@media (min-width:1100px){
  .page.tabm{left:240px;right:0;width:auto;max-width:none;margin:0;padding:32px 44px 60px}
  .page.tabm>*{max-width:960px;margin-left:auto;margin-right:auto}
}
</style>
<style>
input[type=date]{color-scheme:dark}
.ar{display:flex;gap:12px;margin-bottom:10px}.ar label{flex:1;min-width:0;color:var(--mute);font-size:.8rem}
.ar select{display:block;width:100%;font:inherit;color:var(--ink);background:#1b1c20;border:2px solid var(--line);border-radius:12px;padding:10px;margin-top:4px}
.ak{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}.ak>div{background:var(--card);border-radius:18px;padding:14px}.ak small{display:block;color:var(--mute);font-size:.78rem}.ak b{font-size:1.15rem;display:block;margin-top:2px;word-break:break-word}
.anh{margin:20px 0 8px;font-size:1rem;color:var(--pri);font-weight:700}
.cb{display:block;width:100%;text-align:left;padding:8px 0}.cb .r1{display:flex;align-items:center;gap:10px}.cb .r1 span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cb .pg{margin-top:6px;height:8px}
.sc{overflow-x:auto;padding-bottom:4px}
.wd{display:flex;gap:6px;height:120px}.wd>div{flex:1;text-align:center;font-size:.7rem;color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end}.wd i{display:block;background:var(--red);border-radius:6px 6px 0 0;min-height:2px;margin-bottom:4px}
.anb{display:flex;gap:10px;margin:16px 0 0}.anb button{flex:1;padding:12px;border-radius:14px;background:#2a2c33;color:var(--ink);font-weight:700}
.up{color:var(--red)}.dn{color:var(--grn)}

/* Phone: Summary / Calendar / Analytics live in a slide-out side menu */
#drawer,#mbtn{display:none}
@media (max-width:699px){
  #mbtn{display:grid;place-items:center;position:fixed;z-index:6;left:10px;top:calc(10px + env(safe-area-inset-top,0px));width:42px;height:42px;border-radius:50%;background:#16171b;border:2px solid #2b2d33;font-size:1.3rem;color:#cfd6e6}
  #mbtn.on{background:#475266;color:#fff}
  .wrap{padding-top:calc(62px + env(safe-area-inset-top,0px))}
  .wrap .hi{position:absolute;left:62px;right:16px;top:calc(10px + env(safe-area-inset-top,0px));margin:0;height:42px;line-height:42px;font-size:1.4rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .page.tabm{padding-top:calc(62px + env(safe-area-inset-top,0px))}
  #drawer{display:block;position:fixed;inset:0;z-index:40;visibility:hidden;transition:visibility 0s .25s}
  #drawer.open{visibility:visible;transition:none}
  .dbk{position:absolute;inset:0;width:100%;background:rgba(0,0,0,.6);opacity:0;transition:opacity .25s}
  #drawer.open .dbk{opacity:1}
  .dp{position:absolute;left:0;top:0;bottom:0;width:min(78vw,300px);background:#0b0c0f;border-right:2px solid var(--line);padding:calc(28px + env(safe-area-inset-top,0px)) 14px 14px;transform:translateX(-100%);transition:transform .25s}
  #drawer.open .dp{transform:none}
  .dp h3{margin:0 0 18px 10px;font-size:1.7rem;color:var(--pri)}
  .dp button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;margin-bottom:6px;border-radius:16px;font-size:1.05rem;text-align:left}
  .dp button b{font-size:1.35rem;width:1.6em;text-align:center}
  .dp button.on{background:#475266;color:#fff}
}
</style>
</head>

<div id="login" class="login" hidden><form class="lc" id="lf" autocomplete="on">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="72" height="72" role="img" aria-label="Spendly logo" style="display:block;margin-bottom:10px"><defs><linearGradient id="l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbdafc"/><stop offset="1" stop-color="#8fa9e8"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#l)"/><path transform="translate(256 264) scale(1.22) translate(-256 -264)" d="M336 188C318 146 180 140 180 214C180 282 336 244 336 314C336 384 200 380 176 334" fill="none" stroke="#10203d" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/></svg><h2>Spendly</h2><div class="mute">Sign in to your budget</div>

<script>


const D=(n,i,c,t="e")=>({id:"c"+n.replace(/\W/g,""),name:n,icon:i,color:c,type:t});
const DEF=[D("Dining","🍴","#46535f"),D("Groceries","🛒","#3f7a3a"),D("Shopping","🛍️","#8a2142"),D("Transit","🚆","#a39a35"),D("Entertainment","🍿","#2a5d96"),D("Bills & Fees","💵","#3f7a3a"),D("Gifts","🎁","#96352b"),D("Beauty","🌸","#5b2070"),D("Work","💼","#56392e"),D("Travel","🚗","#a0651f"),D("Dinner","🍜","#3b7f8c"),D("Lunch","🧺","#6a82a3"),D("Recharge","📶","#4d5a63"),D("Breakfast","🥤","#5a463d"),D("Tea","🍵","#3b7f8c"),D("Gadgets","🤖","#6a82a3"),D("Badminton","🏸","#6a82a3"),D("Income","👑","#5b4d86","i"),D("Salary","💰","#3f7a3a","i")];
const fresh=()=>({tx:[],cats:JSON.parse(JSON.stringify(DEF)),budgets:{},cur:"QAR",name:"Mohammed Razi",ts:0,bts:0,sts:0,del:{}});
let S=fresh(),KEY="cc2";
function loadS(){S=fresh();if(sess())S.name=sess().email.split("@")[0];try{const d=JSON.parse(localStorage.getItem(KEY));if(d)S=Object.assign(S,d)}catch(e){}}
var bt;const save=ns=>{if(!ns)touch();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(bt);if(!ns&&S.gsUrl&&S.auto!==false)bt=setTimeout(()=>backup(1),3000);if(!ns&&S.gSheetId&&S.gAuto!==false)setTimeout(()=>gBackup(1),3500);if(!ns)queueSync()};
function touch(){S.ts=Date.now();setMeta({dirty:1})}

const users=()=>{try{return JSON.parse(localStorage.getItem("cc-users"))||{}}catch(e){return {}}};

const rnd=n=>{const a=new Uint32Array(n);crypto.getRandomValues(a);return [...a].map(x=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[x%32]).join("")};
async function hash(t,salt){const str=salt+":"+t;
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  let h=5381;for(let i=0;i<str.length;i++)h=(h*33^str.charCodeAt(i))>>>0;return "f"+h}
let md="in",newEmail="";
const say=(t,ok)=>{$("err").textContent=t;$("err").style.color=ok?"var(--grn)":""};
function setMode(m){md=m;
  [...$("modes").children].forEach(b=>b.classList.toggle("on",b.dataset.md===m));

function enter(em,tk){try{localStorage.setItem("cc-sess",JSON.stringify({email:em,tok:tk||""}))}catch(e){}$("p").value="";$("p2").value="";gate()}
const AUTH_MSG={bad_login:"Wrong email or password.",exists:"This email already has an account. Sign in instead.",locked:"Too many wrong attempts. Try again in 10 minutes.",weak:"Password must be at least 6 characters.",bad_email:"Enter a valid email address.",closed:"Sign-ups are closed for this app."};
async function authCall(act,o){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),20000);
  try{const r=await fetch(GS_DEFAULT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action:act},o)),signal:ac.signal});return await r.json()}
  finally{clearTimeout(t)}}
async function cacheUser(em,pw){const all=users(),salt=rnd(8);all[em]={salt,hash:await hash(pw,salt)};putUsers(all)}
async function finish(em,pw,isNew,tk){
  await cacheUser(em,pw);
  if(isNew){try{if(Object.keys(users()).length===1&&localStorage.getItem("cc2")&&!localStorage.getItem("cc2:"+em))localStorage.setItem("cc2:"+em,localStorage.getItem("cc2"))}catch(x){}}
  say("");enter(em,tk)}
$("lf").onsubmit=async e=>{e.preventDefault();
  const em=$("em").value.trim().toLowerCase(),pw=$("p").value,go=$("go");
  if(!/^\S+@\S+\.\S+$/.test(em)){say("Enter a valid email address.");return}
  if(md==="up"){
    if(pw.length<6){say("Password must be at least 6 characters.");return}
    if(pw!==$("p2").value){say("Passwords don't match.");return}}
  go.disabled=true;say("Please wait…",1);
  try{
    let r=null;
    try{r=await authCall(md==="in"?"login":"signup",{email:em,password:pw})}catch(x){r=null}
    if(!r){
      const u=users()[em];
      if(md==="in"&&u&&await hash(pw,u.salt)===u.hash){say("");enter(em);return}
      say("Can't reach the server. Check your connection and try again.");return}
    if(!r.ok){
      if(md==="in"&&r.error==="bad_login"){
        const u=users()[em];
        if(u&&await hash(pw,u.salt)===u.hash){
          let s2=null;try{s2=await authCall("signup",{email:em,password:pw})}catch(x){}
          if(s2&&s2.ok){await finish(em,pw,false,s2.token);return}}}
      say(AUTH_MSG[r.error]||"Something went wrong. Please try again.");return}
    await finish(em,pw,md==="up",r.token)
  }catch(x){say("Something went wrong. Please try again.")}
  finally{go.disabled=false}};

/* ---- cloud sync: every account's data lives in the Google Sheet and follows the login ---- */
let st,sy={busy:false,again:false,err:""};
const SKIP=["gsUrl","gsKey","auto","lastBackup","gEmail","gSheetId","gLast","gAuto"];
function pack(){const o={};for(const k in S)if(!SKIP.includes(k))o[k]=S[k];return o}
function getMeta(){try{return JSON.parse(localStorage.getItem(KEY+":sync"))||{}}catch(e){return {}}}
function setMeta(o){try{localStorage.setItem(KEY+":sync",JSON.stringify(Object.assign(getMeta(),o)))}catch(e){}}
const queueSync=d=>{clearTimeout(st);st=setTimeout(syncNow,d==null?2500:d)};
/* a = this device, b = the cloud copy. Deletions are remembered (S.del) so they are not brought back. */
function mergeS(a,b){
  const del=Object.assign({},b.del);for(const k in a.del)del[k]=Math.max(del[k]||0,a.del[k]);
  const txm=new Map();(b.tx||[]).concat(a.tx||[]).forEach(t=>{const o=txm.get(t.id);if(!o||(t.m||0)>=(o.m||0))txm.set(t.id,t)});
  const cm=new Map();(a.cats||[]).concat(b.cats||[]).forEach(c=>{if(!cm.has(c.id))cm.set(c.id,c)});
  const nb=(a.bts||0)>=(b.bts||0)?a:b,ns=(a.sts||0)>=(b.sts||0)?a:b;
  return Object.assign({},b,a,{tx:[...txm.values()].filter(t=>!del["t"+t.id]),cats:[...cm.values()].filter(c=>!del["c"+c.id]),del,
    budgets:nb.budgets||{},bts:Math.max(a.bts||0,b.bts||0),cur:ns.cur,name:ns.name,sts:Math.max(a.sts||0,b.sts||0),ts:Math.max(a.ts||0,b.ts||0)})}
const rowsOf=()=>sorted(S.tx).map(t=>[t.date,t.time,t.type==="e"?"Expense":"Income",catOf(t.cat).name,t.amt,t.title||""]);
function syncText(){const s=sess(),m=getMeta();
  if(sy.busy)return "Syncing…";
  if(!s||!s.tok)return "Off · sign in while online to turn on";
  if(sy.err)return sy.err+" · tap to retry";
  return m.at?"Up to date · "+new Date(m.at).toLocaleString()+(m.dirty?" · changes waiting":""):"Tap to sync now"}
function syErr(r){const e=r&&r.error;
  if(e==="bad_token"){try{localStorage.removeItem("cc-sess")}catch(x){}gate("Your session expired. Please sign in again.");return}
  sy.err=!r?"Can't reach the server":e==="bad_action"?"Server script is out of date. Redeploy the Apps Script":e==="too_big"?"Data is too large to sync":"Sync failed ("+(e||"error")+")"}
async function syncNow(){
  const s=sess();if(!s||!s.tok||!user())return;
  if(sy.busy){sy.again=true;return}
  const em=s.email,tk=s.tok,live=()=>user()&&user().email===em;
  sy.busy=true;sy.err="";let changed=false;
  if(getMeta().ver===undefined)render();else if(tab==="more")render();
  try{
    for(let i=0;i<4;i++){
      const m=getMeta();
      const r=await authCall("pull",{email:em,token:tk,have:m.ver});
      if(!live())return;
      if(!r||!r.ok){syErr(r);return}
      let remote=null;if(r.data){try{remote=JSON.parse(r.data)}catch(e){remote=null}}
      if(remote){const before=JSON.stringify(pack());S=mergeS(S,remote);changed=changed||JSON.stringify(pack())!==before;save(1)}
      const dirty=m.dirty||m.mirror!==1||(m.ver===undefined&&S.tx.length>0);
      if(!dirty){setMeta({ver:r.ver,at:Date.now()});break}
      const stamp=S.ts,w=await authCall("push",{email:em,token:tk,base:r.ver,data:JSON.stringify(pack()),rows:rowsOf()});
      if(!live())return;
      if(!w||!w.ok){if(w&&w.error==="conflict")continue;syErr(w);return}
      setMeta({ver:w.ver,at:Date.now(),mirror:1,dirty:S.ts!==stamp?1:0});break}
  }catch(e){sy.err="Can't reach the server"}
  finally{sy.busy=false;if(!$("app").hidden&&(changed||tab==="more"||tab==="home"))render();if(sy.again){sy.again=false;queueSync(300)}}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)queueSync(300)});
addEventListener("online",()=>queueSync(300));
setInterval(()=>{if(!document.hidden)queueSync(0)},180000);

/* ---- helpers ---- */

function row(t){const c=catOf(t.cat),e=t.type==="e";return `<button class="tx" data-e="${t.id}"><i class="ci" style="background:${c.color}">${c.icon}</i><div class="g"><b>${esc(t.title||c.name)}</b><em class="${t.type}">${e?"Expenses":"Income"}</em></div><b class="a ${e?"red":"grn"}">${e?"▾":"▴"} ${money(t.amt)}</b></button>`}
function grouped(list){
  if(!list.length)return '<div class="empty">No transactions yet.<br>Tap + to add one.</div>';
  let h="",cur="",items=[];const flush=()=>{if(cur){const net=items.reduce((a,t)=>a+(t.type==="e"?-t.amt:t.amt),0),d=new Date(cur+"T00:00");
    h+=`<div class="day"><span>${d.toLocaleDateString(undefined,{weekday:"long"})}, ${d.getDate()} ${d.toLocaleDateString(undefined,{month:"long"})}</span><span>${net<0?"-":""}${money(Math.abs(net))}</span></div>`+items.map(row).join("")}};
  list.forEach(t=>{if(t.date!==cur){flush();cur=t.date;items=[]}items.push(t)});flush();return h}
function monthTabs(){let h="";for(let i=-8;i<=3;i++){const d=new Date(now.getFullYear(),now.getMonth()+i,1),on=d.getFullYear()===mon.y&&d.getMonth()===mon.m;
  h+=`<button data-m="${d.getFullYear()}-${d.getMonth()}" class="${on?"on":""}">${d.toLocaleDateString(undefined,{month:"long"})}</button>`}return `<div class="months">${h}</div>`}
const inMonth=()=>sorted(S.tx.filter(t=>t.date.startsWith(mon.y+"-"+p2(mon.m+1))));

function chart(){
  const days=[];for(let i=29;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);days.push(dstr(d))}
  const by={};S.tx.filter(t=>t.type==="e").forEach(t=>by[t.date]=(by[t.date]||0)+t.amt);
  let run=0;const pts=days.map(d=>run+=by[d]||0),max=Math.max(run,1);
  const L=44,T=10,W=340,H=190,B=26,R=12,x=i=>L+i*(W-L-R)/29,y=v=>T+(1-v/max)*(H-T-B);
  let g="",lab="";for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#333" stroke-dasharray="2 5"/>`;lab+=`<text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="10" fill="#8b909c">${v>=1000?(v/1000).toFixed(1)+"K":Math.round(v)}</text>`}
  [0,7,14,22,29].forEach(i=>{const d=new Date(days[i]+"T00:00");lab+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#8b909c">${d.getDate()} ${d.toLocaleDateString(undefined,{month:"short"})}</text>`});
  const line=pts.map((v,i)=>(i?"L":"M")+x(i)+" "+y(v)).join(" ");
  return {svg:`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Spending over the last 30 days"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b4c8f5" stop-opacity=".45"/><stop offset="1" stop-color="#b4c8f5" stop-opacity="0"/></linearGradient></defs>${g}${lab}<path d="${line} L${x(29)} ${y(0)} L${x(0)} ${y(0)}Z" fill="url(#gr)"/><path d="${line}" fill="none" stroke="#b4c8f5" stroke-width="2.5" stroke-linejoin="round"/></svg>`,total:run,from:days[0]}}

  const csv="date,time,type,category,amount,title\n"+L.map(t=>[t.date,t.time,t.type==="e"?"expense":"income",q(catOf(t.cat).name),t.amt,q(t.title||"")].join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="spendly-analytics.csv";a.click()}
$("ana").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.x==="anaclose"){if(tab==="ana")tab="home";$("ana").hidden=true;$("ana").classList.remove("tabm");render()}
  else if(d.per){af.per=d.per;drawAnaShell();drawAna()}
  else if(d.ty){af.type=d.ty;drawAnaShell();drawAna()}
  else if(d.cat){af.cat=d.cat;drawAnaShell();drawAna();$("ana").scrollTop=0}
  else if(d.more){af.all=!af.all;drawAna()}
  else if(d.rs){af=AF0();drawAnaShell();drawAna()}
  else if(d.ex)anaExport()
  else if(d.tx)openTx(+d.tx)});
$("ana").addEventListener("input",e=>{const id=e.target.id;
  if(id==="aq")af.q=e.target.value.trim();else if(id==="amin")af.min=e.target.value;else if(id==="amax")af.max=e.target.value;else return;
  af.all=false;drawAna()});
$("ana").addEventListener("change",e=>{const id=e.target.id;
  if(id==="ac")af.cat=e.target.value;else if(id==="afr")af.from=e.target.value;else if(id==="ato")af.to=e.target.value;else return;
  af.all=false;drawAna()});

/* ---- invoice scan (OCR, runs in the browser) ---- */
let ocrP=null,scanning=false;
function loadOCR(){return window.Tesseract?Promise.resolve():ocrP||(ocrP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=res;s.onerror=()=>{ocrP=null;rej(new Error("offline"))};document.head.appendChild(s)}))}
function prepImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();
  i.onload=()=>{const m=Math.min(1,1800/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*m);c.height=Math.round(i.height*m);
    const x=c.getContext("2d");x.filter="grayscale(1) contrast(1.3)";x.drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("img")),"image/png")};
  i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"))};i.src=u})}
function numOf(s){s=s.replace(/\s/g,"");if(/,\d{1,2}$/.test(s)&&s.indexOf(".")<0)s=s.replace(",",".");else s=s.replace(/,/g,"");const n=parseFloat(s);return isFinite(n)?n:NaN}
function amountsIn(l){return(l.match(/\d[\d.,]*\d|\d/g)||[]).map(numOf).filter(n=>n>0&&n<1e7)}
function findTotal(text){
  const L=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const strong=/grand\s*total|total\s*(amount|due|payable|to\s*pay)|amount\s*(due|payable)|net\s*(total|amount|payable)|balance\s*due|إجمالي|الإجمالي|الاجمالي|المجموع/i,
        weak=/total|amount|المبلغ/i,
        skip=/sub\s*-?\s*total|discount|change|tendered|cash\b|paid|saving|qty|items?\b/i,
        tax=/\b(vat|tax|gst)\b/i;
  let best=0,cand=[];
  L.forEach((l,i)=>{
    if(skip.test(l)||(tax.test(l)&&!/incl|inc\b|with/i.test(l)))return;
    const sc=strong.test(l)?3:weak.test(l)?1:0;if(!sc)return;
    let a=amountsIn(l);if(!a.length&&L[i+1]&&!skip.test(L[i+1]))a=amountsIn(L[i+1]);
    if(a.length)cand.push({sc,v:Math.max(...a)})});
  if(cand.length){best=Math.max(...cand.map(c=>c.sc));return Math.max(...cand.filter(c=>c.sc===best).map(c=>c.v))}
  const dec=(text.match(/\d[\d,]*[.,]\d{2}\b/g)||[]).map(numOf).filter(n=>n>0&&n<1e7);
  return dec.length?Math.max(...dec):0}
function okDate(y,m,d){const t=new Date(y,m-1,d);if(t.getFullYear()!==y||t.getMonth()!==m-1||t.getDate()!==d)return null;
  if(t.getTime()>Date.now()+864e5)return null;return y+"-"+p2(m)+"-"+p2(d)}
const MON="jan feb mar apr may jun jul aug sep oct nov dec".split(" ");
function findDate(t){let m;
  if(m=t.match(/\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/)){const r=okDate(+m[1],+m[2],+m[3]);if(r)return r}
  if(m=t.match(/\b(\d{1,2})[-\/.](\d{1,2})[-\/.](20\d{2}|\d{2})\b/)){let y=+m[3],a=+m[1],b=+m[2];if(y<100)y+=2000;if(b>12&&a<=12){const x=a;a=b;b=x}const r=okDate(y,b,a);if(r)return r}
  if(m=t.match(/\b(\d{1,2})[\s-]*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[\s,.-]*(20\d{2})\b/i)){const r=okDate(+m[3],MON.indexOf(m[2].toLowerCase())+1,+m[1]);if(r)return r}
  return null}
function findTitle(t){for(const l of t.split(/\r?\n/)){const x=l.replace(/[^A-Za-z0-9 &'.\-]/g," ").replace(/\s+/g," ").trim();
  if((x.match(/[A-Za-z]/g)||[]).length>=3&&x.length<=40&&!/invoice|receipt|tax|bill|cash|www|http|tel|phone|date|order/i.test(x))return x}return""}
const CATGUESS=[["cGroceries",/grocer|supermarket|hypermarket|mart\b|carrefour|lulu|spar\b/i],["cDining",/restaurant|cafe|coffee|kitchen|pizza|burger|grill|bakery/i],["cTransit",/fuel|petrol|diesel|woqod|taxi|metro/i],["cBillsFees",/ooredoo|vodafone|electric|water|kahramaa|internet|telecom/i]];
function parseInvoice(text){const amt=findTotal(text),date=findDate(text),title=findTitle(text);let cat=null;
  for(const[id,re]of CATGUESS)if(re.test(text)&&S.cats.some(c=>c.id===id&&c.type==="e")){cat=id;break}
  return{amt,date,title,cat}}
function scanMsg(t){const m=$("scm");if(m)m.textContent=t}
$("invf").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f||scanning)return;scanning=true;
  scanMsg("Preparing image…");
  try{
    scanMsg("Loading reader (first scan needs internet)…");await loadOCR();
    const blob=await prepImg(f);
    const r=await Tesseract.recognize(blob,"eng",{logger:m=>{if(m.status==="recognizing text")scanMsg("Reading invoice… "+Math.round(m.progress*100)+"%")}});
    const p=parseInvoice(r.data.text||"");
    if(p.amt>0){form.type="e";form.amt=p.amt.toFixed(2);if(p.date)form.date=p.date;if(!form.title&&p.title)form.title=p.title;if(p.cat)form.cat=p.cat;
      form._msg="Found total "+money(p.amt)+". Please check it matches your invoice, then Save."}
    else form._msg="Couldn't find a total. Try a clearer, well-lit photo, or type the amount.";
    drawForm()
  }catch(err){scanMsg(err&&err.message==="offline"?"Couldn't load the reader. Check your internet and try again.":"Couldn't read this image. Try another photo.")}
  finally{scanning=false}});
$("fab").onclick=()=>openTx(null);
gate();
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(!$("md").hidden){$("md").hidden=true;return}
  for(const id of ["sheet2","sheet","ana","cal"])if(!$(id).hidden){$(id).hidden=true;return}
});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
